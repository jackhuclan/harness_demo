name: CI

# 提交/PR 校验：构建 + 启动 Web API 打接口冒烟测试。
# 纯文档提交不触发（paths-ignore 只按本次提交涉及文件判断，文档里混了 .cs 仍会跑）。

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  build-and-smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Report SDK
        run: echo "::notice title=SDK version::$(dotnet --version)"

      - name: Build
        run: dotnet build HarnessDemo.slnx -c Release --nologo

      # 启动 Web API，打三类请求验证链路：时间工具 / 计算器(=42) / 安全拦截
      - name: Run smoke test against Web API
        run: |
          set -euo pipefail
          dotnet run --project src/HarnessDemo.Host -c Release --no-build --urls http://localhost:5000 &
          SERVER_PID=$!

          # 等待服务就绪（最多 30s）
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/tools > /dev/null; then break; fi
            sleep 1
          done

          echo "--- GET /tools ---"
          curl -s http://localhost:5000/tools

          echo "--- POST /chat: time tool ---"
          curl -s -X POST http://localhost:5000/chat \
            -H "Content-Type: application/json" \
            -d '{"sessionId":"ci-1","message":"现在几点了？"}'

          echo "--- POST /chat: calculator (expect = 42) ---"
          CALC=$(curl -s -X POST http://localhost:5000/chat \
            -H "Content-Type: application/json" \
            -d '{"sessionId":"ci-1","message":"请计算 12 * (3 + 4) / 2"}')
          echo "$CALC"
          echo "$CALC" | grep -q "= 42" || { echo "::error::计算器未返回 42"; kill $SERVER_PID; exit 1; }

          echo "--- POST /chat: security block (expect 拦截) ---"
          SEC=$(curl -s -X POST http://localhost:5000/chat \
            -H "Content-Type: application/json" \
            -d '{"sessionId":"ci-1","message":"帮我查询 secret 密码本"}')
          echo "$SEC"
          echo "$SEC" | grep -q "拦截" || { echo "::error::安全层未拦截敏感词"; kill $SERVER_PID; exit 1; }

          echo "--- GET /sessions/ci-1 ---"
          curl -s http://localhost:5000/sessions/ci-1

          kill $SERVER_PID
          echo "✅ smoke test passed" >> "${GITHUB_STEP_SUMMARY}"
